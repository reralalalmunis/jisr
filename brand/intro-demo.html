<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JISR intro demo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F4F0}
.lg{width:min(320px,70vw);aspect-ratio:564/541}
.lg svg{width:100%;height:100%;display:block;overflow:visible}
/* 1) the ribbon is painted along its centre line */
#rib-stroke{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.55,.05,.35,1) .15s forwards}
/* 2) the dot pops in */
.dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .45s cubic-bezier(.3,1.6,.5,1) 1.15s forwards}
/* 3) the words fade up */
.words{opacity:0;transform:translateY(10px);animation:up .5s ease-out 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#rib-stroke,.dot,.words{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}
</style></head><body>
<div class="lg"><svg viewBox="0 0 564 541" aria-label="جسر JISR" role="img">
  <defs><mask id="rib-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="564" height="541">
    <path id="rib-stroke" pathLength="1" d="M108,282 C109,277 108,263 114,253 C119,244 133,235 142,224 C150,213 156,200 164,188 C172,177 180,166 189,156 C199,146 210,137 222,129 C235,121 248,113 262,109 C275,105 289,102 302,103 C315,104 327,109 339,116 C350,123 360,135 370,145 C380,156 390,169 400,178 C411,187 422,197 433,200 C445,204 460,204 470,199 C479,194 486,181 490,168 C495,156 493,138 497,125 C501,112 512,96 515,90" fill="none" stroke="#fff" stroke-width="160" stroke-linecap="round" stroke-linejoin="round"/>
  </mask></defs>
  <image href="intro-ribbon.png" width="564" height="541" mask="url(#rib-mask)"/>
  <image class="dot" href="intro-dot.png" width="564" height="541"/>
  <image class="words" href="intro-words.png" width="564" height="541"/>
</svg></div>
</body></html>
