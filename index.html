<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مهارة مقابل قيمة | Skill for Value</title>
<meta name="description" content="مهام قصيرة مدفوعة تحوّل مهارات طلاب الجامعة وخريجيها إلى خبرة موثّقة. Short paid tasks that turn students’ skills into verified experience.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F7F6;--surface:#FFFFFF;--ink:#10272B;--muted:#55706F;--line:#D6E0DE;
  --brand:#0B6E66;--brand-d:#08504B;--onbrand:#FFFFFF;--mint:#E2F0ED;
  --gold:#B9791A;--gold-fill:#F0C060;--gold-soft:#FBF1DA;
  --ok:#1F7A4D;--ok-soft:#DFF1E6;--warn:#9A6A0B;--warn-soft:#FBF0D3;--bad:#B3412F;--bad-soft:#F8E2DD;
  --shadow:0 1px 2px rgba(16,39,43,.06),0 8px 24px rgba(16,39,43,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A1C;--surface:#132527;--ink:#E6EFEE;--muted:#9DB3B1;--line:#25393B;
    --brand:#3FB5A6;--brand-d:#7DD3C7;--onbrand:#04201D;--mint:#173032;
    --gold:#E9B44C;--gold-fill:#E9B44C;--gold-soft:#2C2614;
    --ok:#6CD39B;--ok-soft:#14301F;--warn:#E9B44C;--warn-soft:#2C2614;--bad:#F08A78;--bad-soft:#38201B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1C;--surface:#132527;--ink:#E6EFEE;--muted:#9DB3B1;--line:#25393B;
  --brand:#3FB5A6;--brand-d:#7DD3C7;--onbrand:#04201D;--mint:#173032;
  --gold:#E9B44C;--gold-fill:#E9B44C;--gold-soft:#2C2614;
  --ok:#6CD39B;--ok-soft:#14301F;--warn:#E9B44C;--warn-soft:#2C2614;--bad:#F08A78;--bad-soft:#38201B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.7}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;inset-inline-start:12px;top:-64px;background:var(--brand);color:var(--onbrand);padding:8px 14px;border-radius:8px;z-index:60;font-weight:600}
.skip:focus{top:8px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:1.05rem;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.75rem;letter-spacing:.02em}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.seg{display:flex;background:var(--mint);border-radius:999px;padding:3px;gap:2px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:.875rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--onbrand)}
.user{display:flex;align-items:center;gap:8px}
.user .nm{font-weight:600;font-size:.9rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{border-top:1px solid var(--line);background:var(--surface)}
.nav .in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px;align-items:center}
.nav .in::-webkit-scrollbar{display:none}
.nav a{padding:6px 12px;border-radius:8px;white-space:nowrap;font-size:.9rem;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--mint);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--mint);color:var(--brand-d);font-weight:700}

/* generic */
main{padding-block:28px 56px;min-height:60vh}
main:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.95rem;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-d);border-color:var(--brand-d)}
.btn.gold{background:var(--gold-fill);color:#2B1F05;border-color:var(--gold-fill)}
.btn.ghost{background:transparent;color:var(--onbrand);border-color:var(--onbrand)}
.btn.ghost:hover{background:rgba(255,255,255,.12);border-color:var(--onbrand)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card.flat{box-shadow:none}
.card.raise{box-shadow:var(--shadow)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.side{grid-template-columns:minmax(0,1fr) 340px}
.stack>*+*{margin-top:12px}
.ph{margin-bottom:22px}
.ph h1{font-size:1.7rem}
.ph p{color:var(--muted);margin-top:4px;max-width:70ch}
.sec{margin-top:56px}
.sec>h2{font-size:1.45rem;margin-bottom:6px}
.sec>.lead{color:var(--muted);margin-bottom:20px;max-width:70ch}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--brand-d);font-size:.8rem;font-weight:500;border:1px solid transparent}
.chip.v{background:var(--ok-soft);color:var(--ok)}
.chip.r{background:var(--warn-soft);color:var(--warn)}
.chip.d{background:transparent;border-color:var(--line);color:var(--muted)}
.chip.p{background:var(--gold-soft);color:var(--gold)}
.chip.no{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.chip{cursor:pointer;font-family:inherit}
button.chip.on{background:var(--brand);color:var(--onbrand)}
.field{display:block}
.field>span{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.field textarea{min-height:92px;resize:vertical}
.field small{color:var(--muted);display:block;margin-top:4px}
.form{display:grid;gap:14px}
.hr{height:1px;background:var(--line);border:0;margin:16px 0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.note{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.875rem;border-inline-start:4px solid var(--gold-fill)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:700;font-size:1.2rem;flex:none}
.avatar.sm{width:36px;height:36px;font-size:.85rem}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.money small{font-weight:500;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.link{text-decoration:underline;text-underline-offset:3px;color:var(--brand-d);font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center;padding-block:18px 8px}
.hero h1{font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.25;letter-spacing:-.01em}
.hero p.sub{font-size:1.1rem;color:var(--muted);margin-top:16px;max-width:52ch}
.hero .cta{margin-top:26px}
.cred{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.cred .t{padding:20px 22px}
.cred .perf{position:relative;border-top:2px dashed var(--line)}
.cred .perf::before,.cred .perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.cred .perf::before{inset-inline-start:-11px}
.cred .perf::after{inset-inline-end:-11px}
.cred .split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cred .split div{background:var(--mint);border-radius:10px;padding:10px 12px}
.cred .split div.g{background:var(--gold-soft)}
.cred .split b{display:block;font-size:1.25rem}
.cred .rec{background:var(--brand);color:var(--onbrand);padding:18px 22px}
.cred .rec .id{direction:ltr;text-align:start;font-size:.8rem;opacity:.85;letter-spacing:.04em}

/* journey */
.journey{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:12px;counter-reset:j}
.journey .j{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 14px}
.journey .j::before{counter-increment:j;content:counter(j);width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:700;font-size:.9rem;margin-bottom:10px}
.journey .j b{display:block;font-size:.98rem;line-height:1.4}
.journey .j span{display:block;font-size:.84rem;color:var(--muted);margin-top:4px}
table.cmp{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:640px}
table.cmp th,table.cmp td{padding:12px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
table.cmp th{background:var(--mint);font-size:.9rem}
table.cmp td:last-child{background:color-mix(in srgb,var(--mint) 45%,var(--surface));font-weight:500}
table.cmp tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.qa+details.qa{margin-top:10px}
details.qa summary{cursor:pointer;font-weight:600}
details.qa p{margin-top:8px;color:var(--muted)}

/* tasks */
.tcard{display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.tcard:hover{border-color:var(--brand)}
.tcard h3{font-size:1.05rem}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.85rem;background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.ring{--p:70;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.kpi{padding:16px 18px}
.kpi b{display:block;font-size:1.6rem;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85rem}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-block:14px}
.stepper .s{text-align:center;font-size:.78rem;color:var(--muted);position:relative}
.stepper .s i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;background:var(--line);color:var(--muted);font-style:normal;font-weight:700;position:relative;z-index:1}
.stepper .s::before{content:"";position:absolute;top:13px;height:3px;background:var(--line);inset-inline:-50% 50%;z-index:0}
.stepper .s:first-child::before{display:none}
.stepper .s.done i{background:var(--brand);color:var(--onbrand)}
.stepper .s.done::before{background:var(--brand)}
.stepper .s.cur i{background:var(--gold-fill);color:#2B1F05}
.stepper .s.cur{color:var(--ink);font-weight:600}
.stepper .s.cur::before{background:var(--brand)}

/* stars */
.stars{display:flex;gap:2px}
.stars button{border:0;background:transparent;font-size:1.7rem;line-height:1;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:var(--gold-fill)}

.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
footer.ft{border-top:1px solid var(--line);background:var(--surface);padding-block:32px 24px;color:var(--muted);font-size:.9rem}
footer.ft .cols{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:28px}
footer.ft h4{color:var(--ink);font-size:.95rem;margin-bottom:8px}
footer.ft ul{list-style:none;margin:0;padding:0}
footer.ft li+li{margin-top:6px}
footer.ft a:hover{color:var(--ink);text-decoration:underline}
footer.ft .copy{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .journey{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side{grid-template-columns:1fr}
  footer.ft .cols{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .wrap{padding-inline:14px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .journey{grid-template-columns:1fr}
  .stepper .s{font-size:.68rem}
  .ph h1{font-size:1.4rem}
  .user .nm{display:none}
  footer.ft .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ================= محرك المطابقة / Matching ================= */
function match(st,t){
  const per=t.skills.map(k=>({skill:k,status:st.skills[k]||null,w:st.skills[k]?SK_W[st.skills[k]]:0}));
  const sk=per.reduce((a,b)=>a+b.w,0)/per.length*70;
  const field=st.fields.includes(t.cat)?15:0;
  const av=Math.min(1,st.hours/t.hours)*15;
  return {total:Math.round(sk+field+av),parts:{skills:Math.round(sk),field:Math.round(field),avail:Math.round(av)},per};
}
const pillCls=p=>p>=70?'':p>=45?'mid':'low';

      <div class="card"><h3>${tr('intTitle')}</h3><p class="small muted">${tr('intLead')}</p>
        <div class="chips" style="margin-top:10px">${Object.keys(CATS).map(c=>`<button class="chip ${s.fields.includes(c)?'on':''}" data-act="toggleField" data-k="${c}" aria-pressed="${s.fields.includes(c)}">${esc(L(CATS[c]))}</button>`).join('')}</div>

/* ================= المهام / Tasks ================= */
function taskCard(t){
  const isStu=S.role==='student';
  const r=isStu?match(me(),t):null;
  const applied=isStu&&S.apps.some(a=>a.task===t.id&&a.student===S.me);
  const sk=isStu?me().skills:{};
  return `<a class="card tcard" href="#/task/${t.id}">
    <div class="row between"><span class="small muted">${esc(L(bz(t.biz).name))}</span>${r?`<span class="pill ${pillCls(r.total)}" title="${esc(tr('matchTitle'))}">${r.total}%</span>`:`<span class="chip">${esc(L(CATS[t.cat]))}</span>`}</div>
    <h3>${esc(L(t.title))}</h3>
    <div class="chips">${t.skills.map(k=>skillChip(k,sk[k],!isStu)).join('')}</div>
    <div class="row between" style="margin-top:auto"><span>${money(t.budget)}</span><span class="small muted">${tr('daysN',t.days)} · ${tr('hoursWk',t.hours)}</span></div>
    ${applied?`<span class="chip p">${tr('applied')}</span>`:''}</a>`;
}
function curSort(){
  if(S.ui.sort==='match'&&S.role!=='student')return 'new';
  return S.ui.sort||(S.role==='student'?'match':'new');
}
function taskCards(){
  let list=S.tasks.filter(t=>t.status==='open');
  if(S.ui.cat!=='all')list=list.filter(t=>t.cat===S.ui.cat);
  const q=(S.ui.q||'').trim().toLowerCase();
  if(q)list=list.filter(t=>(both(t.title)+' '+t.skills.map(k=>both(SK[k])).join(' ')+' '+both(bz(t.biz).name)).toLowerCase().includes(q));
  const sort=curSort();
  if(sort==='new')list=list.slice().reverse();
  if(sort==='match'){const m=t=>match(me(),t).total;list.sort((a,b)=>m(b)-m(a))}
  if(sort==='pay')list.sort((a,b)=>b.budget-a.budget);
  if(sort==='short')list.sort((a,b)=>a.days-b.days);
  if(!list.length)return `<div class="card empty" style="grid-column:1/-1"><b>${tr('noTasks')}</b>${tr('noTasksHint')}</div>`;
  return list.map(taskCard).join('');
}
function tasks(){
  const catBtn=(k,l)=>`<button class="chip ${S.ui.cat===k?'on':''}" data-act="set" data-k="cat" data-v="${k}">${l}</button>`;
  const sort=curSort();
  const opt=(v,k)=>`<option value="${v}" ${sort===v?'selected':''}>${tr(k)}</option>`;
  return `<div class="wrap"><div class="ph"><h1>${tr('tasksTitle')}</h1><p>${tr(S.role==='student'?'tasksLeadStu':'tasksLeadGuest')}</p></div>
  <div class="card flat" style="margin-bottom:18px"><div class="row between">
    <div class="chips">${catBtn('all',tr('catAll'))}${Object.entries(CATS).map(([k,l])=>catBtn(k,esc(L(l)))).join('')}</div>
    <div class="row"><input data-live="q" placeholder="${esc(tr('searchPh'))}" value="${esc(S.ui.q)}" aria-label="${tr('searchAria')}" style="padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)">
      <select data-sel="sort" aria-label="${tr('sortAria')}" style="padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)">
        ${opt('new','sortNew')}${S.role==='student'?opt('match','sortMatch'):''}${opt('pay','sortPay')}${opt('short','sortShort')}</select></div></div></div>
  <div class="grid g3" id="taskList">${taskCards()}</div></div>`;
}

      <div class="card"><h3>${tr('descTitle')}</h3><p class="muted" style="margin-top:6px">${esc(L(t.desc))}</p>

      ${r&&t.status==='open'?`<div class="card"><div class="row"><div class="ring" style="--p:${r.total}"><span>${r.total}%</span></div><div><h3>${tr('yourMatch')}</h3><p class="small muted">${tr('matchParts',r.parts.skills,r.parts.field,r.parts.avail)}</p></div></div></div>`:''}

/* ================= المرشحون / Matching ================= */
function matching(){
  const g=gate(['business'],'gateBiz');if(g)return g;
  const open=S.tasks.filter(t=>t.biz===S.biz&&t.status==='open');
  if(!open.length)return `<div class="wrap"><div class="ph"><h1>${tr('matchPageTitle')}</h1></div><div class="card empty"><b>${tr('noOpen')}</b>${tr('noOpenHint')}<p style="margin-top:12px"><a class="btn primary" href="#/business">${tr('postTitle')}</a></p></div></div>`;
  const t=open.find(x=>x.id===S.ui.matchTask)||open[0];
  const ranked=S.students.map(s=>({s,r:match(s,t),applied:S.apps.find(a=>a.task===t.id&&a.student===s.id)})).sort((a,b)=>b.r.total-a.r.total||(b.applied?1:0)-(a.applied?1:0));
  return `<div class="wrap"><div class="ph"><h1>${tr('matchPageTitle')}</h1><p>${tr('matchLead')}</p></div>
  <div class="card flat" style="margin-bottom:18px"><label class="field"><span>${tr('taskLabel')}</span><select data-sel="matchTask">${open.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(L(x.title))}</option>`).join('')}</select></label>
    <div class="chips" style="margin-top:10px">${t.skills.map(k=>skillChip(k,null,true)).join('')}</div></div>
  <div class="grid side"><div class="stack">${ranked.map(({s,r,applied})=>`<div class="card"><div class="row">
      <div class="ring" style="--p:${r.total}"><span>${r.total}%</span></div>
      <div style="flex:1;min-width:200px"><div class="row"><b>${esc(L(s.name))}</b>${applied?`<span class="chip p">${tr('appliedChip')}</span>`:''}</div>
        <p class="small muted">${esc([L(s.major),L(LV[s.level]||s.level),tr('hoursWk',s.hours)].filter(Boolean).join(' · '))}</p>
        <div class="chips" style="margin-top:6px">${r.per.map(p=>skillChip(p.skill,p.status)).join('')}</div></div>
      <button class="btn ${applied?'primary':''}" data-act="pick" data-id="${t.id}" data-s="${s.id}">${tr('pick')}</button></div>
      <div class="grid g3" style="margin-top:12px;gap:10px">
        <div><div class="row between small"><span>${tr('pSkills')}</span><b>${r.parts.skills}/70</b></div><div class="meter"><i style="width:${r.parts.skills/70*100}%"></i></div></div>
        <div><div class="row between small"><span>${tr('pField')}</span><b>${r.parts.field}/15</b></div><div class="meter"><i style="width:${r.parts.field/15*100}%"></i></div></div>
        <div><div class="row between small"><span>${tr('pAvail')}</span><b>${r.parts.avail}/15</b></div><div class="meter"><i style="width:${r.parts.avail/15*100}%"></i></div></div></div>
      ${applied?`<p class="small muted" style="margin-top:10px">«${esc(L(applied.msg))}» — ${tr('proposedDays',applied.days)}</p>`:''}
    </div>`).join('')}</div>
    <div class="card" style="align-self:start"><h3>${tr('howCalc')}</h3>
      <div class="stack small" style="margin-top:8px"><p>${tr('howSkills')}</p><p>${tr('howField')}</p><p>${tr('howAvail')}</p></div></div></div></div>`;
}

/* ================= المشاريع / Projects ================= */
const CUR={assigned:1,in_progress:1,submitted:3,completed:5};
function projects(){
  const g=gate(['student','business'],'gateAny');if(g)return g;
  const isStu=S.role==='student';
  const list=S.tasks.filter(t=>t.status!=='open'&&(isStu?t.assignee===S.me:t.biz===S.biz));
  const steps=['step1','step2','step3','step4','step5'].map(tr);
  return `<div class="wrap"><div class="ph"><h1>${tr('projTitle')}</h1><p>${tr(isStu?'projSubStu':'projSubBiz')}</p></div>
  <div class="stack">${list.length?list.map(t=>{
    const c=CUR[t.status];const s=stu(t.assignee);
    const stepper=`<div class="stepper">${steps.map((l,i)=>`<div class="s ${i<c?'done':i===c?'cur':''}"><i>${i<c?'✓':i+1}</i>${l}</div>`).join('')}</div>`;
    let actions='';
    if(isStu){
      if(t.status==='assigned')actions=`<button class="btn primary" data-act="start" data-id="${t.id}">${tr('startWork')}</button>`;
      if(t.status==='in_progress')actions=`<div class="form" style="width:100%"><label class="field"><span>${tr('deliverLabel')}</span><textarea data-bind="dl_${t.id}" placeholder="${esc(tr('deliverPh'))}">${esc(vf('dl_'+t.id))}</textarea></label><div><button class="btn primary" data-act="deliver" data-id="${t.id}">${tr('deliverBtn')}</button></div></div>`;
      if(t.status==='submitted')actions=`<span class="chip p">${tr('awaiting')}</span>`;
      if(t.status==='completed')actions=`<a class="btn" href="#/review">${tr('viewRecord')}</a>`;
    }else{
      if(t.status==='submitted')actions=`<button class="btn primary" data-act="goReview" data-id="${t.id}">${tr('reviewApprove')}</button><button class="btn" data-act="revise" data-id="${t.id}">${tr('reqChanges')}</button>`;
      if(t.status==='completed')actions=`<span class="chip v">${tr('completedChip',esc(t.record))}</span>`;
    }
    return `<div class="card"><div class="row between"><div><h3>${esc(L(t.title))}</h3><p class="small muted">${esc(L(bz(t.biz).name))} · ${tr('studentIs',esc(L(s.name)))} · ${fmt(t.budget)} ${tr('cur')}</p></div>
      <span class="chip ${t.status==='completed'?'v':''}">${stLabel(t.status)}</span></div>
      ${stepper}
      ${t.status!=='completed'?`<p class="small muted">${tr(t.status==='submitted'?'submittedNote':'heldNote')}</p>`:''}
      ${t.delivery?`<div class="note" style="margin-top:10px"><b>${tr('deliveryNotes')}</b> ${esc(L(t.delivery))}</div>`:''}
      ${t.revNote?`<div class="note" style="margin-top:10px"><b>${tr('changeReq')}</b> ${tr('revNoteText')}</div>`:''}
      ${actions?`<div class="row" style="margin-top:12px">${actions}</div>`:''}</div>`}).join(''):`<div class="card empty"><b>${tr('emptyProj')}</b>${tr(isStu?'emptyProjStu':'emptyProjBiz')}<p style="margin-top:12px"><a class="btn primary" href="#/${isStu?'tasks':'matching'}">${tr(isStu?'browseTasks':'viewCands')}</a></p></div>`}</div></div>`;
}

/* ================= التقييم والإنجازات / Reviews & achievements ================= */
function stars(k){const v=S.ui.rev[k]||0;return `<div class="stars" role="radiogroup">${[1,2,3,4,5].map(i=>`<button type="button" class="${i<=v?'on':''}" data-act="rate" data-k="${k}" data-v="${i}" aria-label="${tr('ofFive',i)}">★</button>`).join('')}</div>`}
function recCard(t){
  const s=stu(t.assignee);const a=avgRate(t);
  return `<div class="cred"><div class="t"><div class="row between"><b>${esc(L(t.title))}</b><span class="chip v">${tr('verified')}</span></div>
    <p class="small muted">${esc(L(s.name))} · ${esc(L(bz(t.biz).name))} · ${esc(t.doneAt)}</p>
    <div class="chips" style="margin-top:10px">${t.skills.map(k=>skillChip(k,(t.proved||[]).includes(k)?'V':'D')).join('')}</div>
    <p class="small muted" style="margin-top:6px">${tr('provedNote')}</p>
    ${t.comment?`<p class="small" style="margin-top:8px">“${esc(L(t.comment))}”</p>`:''}</div>
    <div class="perf"></div>
    <div class="rec"><div class="row between"><span>★ ${a.toFixed(1)} / 5</span><span class="num">${fmt(t.budget)} ${tr('cur')}</span></div>
      <p class="id">${esc(t.record)}</p></div></div>`;
}
function review(){
  const g=gate(['student','business'],'gateAny');if(g)return g;
  const isStu=S.role==='student';
  const recs=S.tasks.filter(t=>t.status==='completed'&&(isStu?t.assignee===S.me:t.biz===S.biz));
  let form='';
  if(!isStu){
    const pend=S.tasks.filter(t=>t.status==='submitted'&&t.biz===S.biz);
    if(!pend.length){
      form=`<div class="card empty"><b>${tr('noPending')}</b>${tr('noPendingHint')}</div>`;
    }else{
      const t=pend.find(x=>x.id===S.ui.revTask)||pend[0];const s=stu(t.assignee);
      form=`<div class="card raise"><h3>${tr('evalTitle',esc(L(t.title)))}</h3><p class="small muted">${tr('studentIs',esc(L(s.name)))}</p>
        ${pend.length>1?`<label class="field" style="margin-top:10px"><span>${tr('taskLabel')}</span><select data-sel="revTask">${pend.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(L(x.title))}</option>`).join('')}</select></label>`:''}
        ${t.delivery?`<div class="note" style="margin-top:10px">${esc(L(t.delivery))}</div>`:''}
        <div class="grid g2" style="margin-top:14px">
          <div><span class="small"><b>${tr('rQ')}</b></span>${stars('q')}</div><div><span class="small"><b>${tr('rC')}</b></span>${stars('c')}</div>
          <div><span class="small"><b>${tr('rT')}</b></span>${stars('t')}</div><div><span class="small"><b>${tr('rF')}</b></span>${stars('f')}</div></div>
        <div class="field" style="margin-top:14px"><span>${tr('provedTitle')}</span><div class="chips">${t.skills.map(k=>`<button type="button" class="chip ${(S.ui.proved||[]).includes(k)?'on':''}" data-act="toggleProved" data-k="${k}" aria-pressed="${(S.ui.proved||[]).includes(k)}">${esc(L(SK[k]))}</button>`).join('')}</div><small>${tr('provedHint')}</small></div>
        <label class="field" style="margin-top:14px"><span>${tr('commentLabel')}</span><textarea data-bind="revComment">${esc(vf('revComment'))}</textarea></label>
        <div class="row" style="margin-top:14px"><button class="btn primary" data-act="submitReview" data-id="${t.id}">${tr('approveBtn')}</button></div>
        <p class="small muted" style="margin-top:8px">${tr('approveNote',fmt(t.budget))}</p></div>`;
    }
  }
  return `<div class="wrap"><div class="ph"><h1>${tr(isStu?'achTitle':'revTitle')}</h1><p>${tr(isStu?'achLead':'revLead')}</p></div>
  ${form}
  <div class="sec" style="margin-top:${form?'40px':'0'}"><h2 style="font-size:1.2rem;margin-bottom:12px">${tr(isStu?'recsStu':'recsBiz')}</h2>
  ${recs.length?`<div class="grid g3">${recs.map(t=>`<div>${recCard(t)}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="copy" data-v="${esc(t.record)}">${tr('copyRec')}</button></div></div>`).join('')}</div>`:`<div class="card empty"><b>${tr('noRecs')}</b>${tr('noRecsHint')}</div>`}</div></div>`;
}

/* ================= العرض والتوجيه / Rendering & routing ================= */
const VIEWS={home,auth,profile,tasks,task,business,matching,projects,review};
function parse(){const h=(location.hash||'#/home').replace(/^#\//,'').split('/');S.route=VIEWS[h[0]]?h[0]:'home';S.param=h[1]||null}
function render(){
  // Organizations don't use the task list; send them to their dashboard
  if(S.route==='tasks'&&S.role==='business'){S.route='business';history.replaceState(null,'','#/business')}
  applyLang();
  $('#app').innerHTML=header()+`<main id="main" tabindex="-1">${VIEWS[S.route]()}</main>`+footer();
}
window.addEventListener('hashchange',()=>{parse();render();window.scrollTo(0,0)});

/* ================= التفاعل / Actions ================= */
const A={
  skip(el,e){e.preventDefault();const m=$('#main');if(m)m.focus()},
  lang(){S.lang=S.lang==='ar'?'en':'ar';LS.set('sfv-lang',S.lang);render()},
  set(el){S.ui[el.dataset.k]=el.dataset.v;render()},
  howTab(el){S.ui.howTab=el.dataset.v;render()},
  scrollTo(el,e){
    e.preventDefault();const id=el.dataset.v;
    const run=()=>{const n=document.getElementById(id);if(n)n.scrollIntoView({behavior:'smooth',block:'start'})};
    if(S.route!=='home'){location.hash='#/home';setTimeout(run,60)}else run();
  },
  goSignup(el){S.ui.authTab='signup';if(el.dataset.v)S.ui.authRole=el.dataset.v;go('#/auth')},
  goLogin(el){S.ui.authTab='login';if(el.dataset.v)S.ui.authRole=el.dataset.v;go('#/auth')},
  logout(){S.role='guest';toast(tr('loggedOut'));go('#/home')},
  auth(){
    const f=S.ui.f,signup=S.ui.authTab==='signup',st=S.ui.authRole==='student';
    const mail=(f.auMail||'').trim().toLowerCase(),name=(f.auName||'').trim();
    if(!mail||!f.auPass){toast(tr('needMailPass'));return}
    if(signup&&!name){toast(tr(st?'needNameStu':'needNameBiz'));return}
    if(signup){
      const id=(st?'s':'b')+'n'+(++S.seq);
      if(st){S.students.push({id,name,major:(f.auMajor||'').trim(),level:f.auLevel==='grad'?'grad':'student',hours:8,fields:[],skills:{},pend:{},portfolio:''});S.me=id}
      else{S.bizs.push({id,name,sector:(f.auSector||'').trim()});S.biz=id}
      S.accounts.push({email:mail,role:st?'student':'business',id});
      S.role=st?'student':'business';
    }else{
      const acc=S.accounts.find(a=>a.email===mail);
      if(acc){S.role=acc.role;if(acc.role==='student')S.me=acc.id;else S.biz=acc.id}
      else{S.role=st?'student':'business';if(st)S.me='s1';else S.biz='b2'}
    }
    ['auName','auMail','auPass','auMajor','auSector','auCR','auLevel'].forEach(k=>delete f[k]);
    toast(tr(signup?'signedUp':'loggedIn'));
    go(S.role==='business'?'#/business':'#/profile');
  },
  verify(el){const s=me(),k=el.dataset.k;s.pend[k]=s.skills[k];s.skills[k]='P';toast(tr('verifySent'));render()},
  addSkill(){const k=$('#newSkill')?.value;if(!k)return;me().skills[k]='D';toast(tr('skillAdded'));render()},
  toggleField(el){const s=me(),k=el.dataset.k;s.fields=s.fields.includes(k)?s.fields.filter(x=>x!==k):[...s.fields,k];render()},
  apply(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id);const msg=(vf('applyMsg')||'').trim();
    if(msg.length<10){toast(tr('msgShort'));return}
    S.apps.push({id:'a'+(S.apps.length+1),task:t.id,student:S.me,msg,days:+vf('applyDays')||t.days});
    S.ui.f.applyMsg='';S.ui.f.applyDays='';toast(tr('applySent'));render();
  },
  togglePostSkill(el){const k=el.dataset.k;const a=Array.isArray(S.ui.f.postSkills)?S.ui.f.postSkills:[];S.ui.f.postSkills=a.includes(k)?a.filter(x=>x!==k):[...a,k];render()},
  post(){
    const f=S.ui.f;const sk=Array.isArray(f.postSkills)?f.postSkills:[];
    if(!(f.postTitle||'').trim()){toast(tr('needTitle'));return}
    if(!(f.postDesc||'').trim()){toast(tr('needDesc'));return}
    if(!sk.length){toast(tr('needSkill'));return}
    if(!(+f.postBudget>=100)){toast(tr('minBudget'));return}
    if(!(+f.postDays>=1)){toast(tr('needDays'));return}
    const id='t'+(S.tasks.length+1);
    S.tasks.push({id,title:f.postTitle.trim(),biz:S.biz,cat:f.postCat||'design',desc:f.postDesc.trim(),deliv:(f.postDeliv||'').split('\n').map(x=>x.trim()).filter(Boolean),skills:sk,budget:+f.postBudget,days:+f.postDays,hours:10,status:'open'});
    ['postTitle','postDesc','postDeliv','postBudget','postDays','postSkills','postCat'].forEach(k=>delete f[k]);
    S.ui.matchTask=id;toast(tr('posted'));render();
  },
  openMatch(el){S.ui.matchTask=el.dataset.id;go('#/matching')},
  pick(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id);t.assignee=el.dataset.s;t.status='assigned';
    S.apps=S.apps.filter(a=>a.task!==t.id||a.student===t.assignee);
    toast(tr('picked',L(stu(t.assignee).name)));go('#/projects');
  },
  start(el){S.tasks.find(x=>x.id===el.dataset.id).status='in_progress';toast(tr('started'));render()},
  deliver(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id);const d=(vf('dl_'+t.id)||'').trim();
    if(d.length<5){toast(tr('needDelivery'));return}
    t.delivery=d;t.revNote=null;t.status='submitted';toast(tr('submitted'));render();
  },
  revise(el){const t=S.tasks.find(x=>x.id===el.dataset.id);t.status='in_progress';t.revNote=true;toast(tr('changesSent'));render()},
  goReview(el){S.ui.revTask=el.dataset.id;go('#/review')},
  rate(el){S.ui.rev[el.dataset.k]=+el.dataset.v;render()},
  toggleProved(el){const k=el.dataset.k;const a=S.ui.proved||[];S.ui.proved=a.includes(k)?a.filter(x=>x!==k):[...a,k];render()},
  submitReview(el){
    const r=S.ui.rev;if(!(r.q&&r.c&&r.t&&r.f)){toast(tr('rateAll'));return}
    const t=S.tasks.find(x=>x.id===el.dataset.id);const s=stu(t.assignee);
    t.rating={q:r.q,c:r.c,t:r.t,f:r.f};t.comment=vf('revComment');t.proved=S.ui.proved||[];
    t.status='completed';t.doneAt=new Date().toISOString().slice(0,10);
    t.record='SFV-2026-'+String(S.tasks.filter(x=>x.record).length+1).padStart(4,'0');
    t.proved.forEach(k=>{const cur=s.skills[k];if(!cur)s.skills[k]='R';else if(cur==='D'||cur==='P')s.skills[k]='R';else if(cur==='R')s.skills[k]='V'});
    S.ui.rev={};S.ui.proved=[];S.ui.f.revComment='';S.ui.revTask=null;
    toast(tr('approved',t.record));render();
  },
  copy(el){try{navigator.clipboard.writeText(el.dataset.v).then(()=>toast(tr('copied')),()=>toast(tr('copyFail')))}catch(e){toast(tr('copyFail'))}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.live==='q'){S.ui.q=el.value;$('#taskList').innerHTML=taskCards();return}
  const k=el.dataset.bind;if(k)S.ui.f[k]=el.value;
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.sel){S.ui[el.dataset.sel]=el.value;render();return}
  if(el.dataset.hours!==undefined){me().hours=+el.value;render();return}
  const k=el.dataset.bind;if(k)S.ui.f[k]=el.value;
});

S.lang=LS.get('sfv-lang')==='en'?'en':'ar';
parse();render();
</script>
</body>
</html>
